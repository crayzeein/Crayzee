name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validate Backend Syntax
        run: |
          cd backend
          npm install --package-lock-only || npm install --omit=dev
          node -c index.js

      - name: Build Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
        env:
          NEXT_PUBLIC_API_URL: https://crayzee.onrender.com/api
